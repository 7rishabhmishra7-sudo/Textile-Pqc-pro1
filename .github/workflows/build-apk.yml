name: Build Textile PQC Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q Textile_PQC_Pro_Android_Project_v1.1.zip -d project

      - name: Build APK
        run: |
          GRADLEW=$(find project -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper not found in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Textile-PQC-Pro-APK
          path: project/**/build/outputs/apk/debug/*.apk
